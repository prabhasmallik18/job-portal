<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - API Test & Diagnostics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .stats {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stats h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .stat-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #667eea;
            font-size: 2em;
            font-weight: 700;
        }
        .jobs-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .jobs-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        .jobs-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        .jobs-table tr:hover {
            background: #f8f9fa;
        }
        .company-badge {
            display: inline-block;
            background: #e7f3ff;
            color: #0066cc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill-tag {
            background: #f0f0f0;
            color: #333;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
            margin: 10px 0;
        }
        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3c3;
            margin: 10px 0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Job Portal - Diagnostics Dashboard</h1>
        
        <div class="cards">
            <div class="card">
                <h2>📊 Database Stats</h2>
                <p>View total companies and jobs in the database</p>
                <button class="btn" onclick="getStats()">Get Statistics</button>
            </div>
            <div class="card">
                <h2>💼 All Companies</h2>
                <p>List all registered companies with their credentials</p>
                <button class="btn" onclick="getCompanies()">View Companies</button>
            </div>
            <div class="card">
                <h2>📋 All Jobs</h2>
                <p>View all 49 jobs in the system</p>
                <button class="btn" onclick="getAllJobs()">View All Jobs</button>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        async function getStats() {
            showLoading('Fetching database statistics...');
            try {
                const response = await fetch('http://localhost:5001/api/company/debug/stats');
                const data = await response.json();
                
                if (data.success) {
                    let html = `<div class="stats">
                        <h2>📊 Database Statistics</h2>
                        <div class="stat-row">
                            <div class="stat-item">
                                <div class="stat-label">Total Companies</div>
                                <div class="stat-value">${data.totalCompanies}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Total Jobs</div>
                                <div class="stat-value">${data.totalJobs}</div>
                            </div>
                        </div>
                        <h3 style="color: #667eea; margin-top: 20px; margin-bottom: 15px;">Jobs by Company:</h3>
                        <table class="jobs-table">
                            <tr>
                                <th>Company</th>
                                <th>Job Count</th>
                            </tr>`;
                    
                    data.jobsByCompany.forEach(jc => {
                        html += `<tr>
                            <td><span class="company-badge">${jc.companyName}</span></td>
                            <td><strong>${jc.jobCount}</strong> jobs</td>
                        </tr>`;
                    });
                    
                    html += `</table></div><div class="success">✅ Database is properly configured with ${data.totalJobs} jobs across ${data.totalCompanies} companies!</div>`;
                    document.getElementById('results').innerHTML = html;
                }
            } catch (e) {
                document.getElementById('results').innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
            }
        }

        async function getCompanies() {
            showLoading('Fetching companies...');
            try {
                const response = await fetch('http://localhost:5001/api/company/debug/stats');
                const data = await response.json();
                
                if (data.success) {
                    let html = `<div class="stats">
                        <h2>💼 All Companies Available</h2>
                        <table class="jobs-table">
                            <tr>
                                <th>Company Name</th>
                                <th>Email</th>
                                <th>Password</th>
                            </tr>`;
                    
                    data.companies.forEach(company => {
                        html += `<tr>
                            <td><strong>${company.name}</strong></td>
                            <td><code>${company.email}</code></td>
                            <td><code>${company.name.toLowerCase().split(' ')[0]}@123</code></td>
                        </tr>`;
                    });
                    
                    html += `</table>
                    <div class="success" style="margin-top: 20px;">
                    ✅ Use any of these credentials to login as a recruiter and manage jobs!
                    </div></div>`;
                    document.getElementById('results').innerHTML = html;
                }
            } catch (e) {
                document.getElementById('results').innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
            }
        }

        async function getAllJobs() {
            showLoading('Fetching all jobs...');
            try {
                const response = await fetch('http://localhost:5001/api/company/debug/all-jobs');
                const data = await response.json();
                
                if (data.success) {
                    let html = `<div class="stats">
                        <h2>📋 All ${data.totalJobs} Jobs in System</h2>
                        <table class="jobs-table">
                            <tr>
                                <th>Job Title</th>
                                <th>Location</th>
                                <th>Category</th>
                                <th>Company</th>
                            </tr>`;
                    
                    data.jobs.forEach(job => {
                        html += `<tr>
                            <td><strong>${job.title}</strong></td>
                            <td>${job.location}</td>
                            <td>${job.category}</td>
                            <td><span class="company-badge">${job.companyId.name}</span></td>
                        </tr>`;
                    });
                    
                    html += `</table><div class="success" style="margin-top: 20px;">✅ All jobs are properly distributed across companies and ready to view!</div></div>`;
                    document.getElementById('results').innerHTML = html;
                }
            } catch (e) {
                document.getElementById('results').innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
            }
        }

        function showLoading(message) {
            document.getElementById('results').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
