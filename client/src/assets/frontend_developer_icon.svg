<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Frontend Developer (React) Icon -->
  <defs>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- React Atom - Central nucleus -->
  <circle cx="32" cy="32" r="4" fill="white"/>
  
  <!-- Electron orbits (3 orbits rotated) -->
  <!-- Orbit 1 -->
  <ellipse cx="32" cy="32" rx="14" ry="6" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="46" cy="32" r="2" fill="white"/>
  
  <!-- Orbit 2 (rotated 60 degrees) -->
  <ellipse cx="32" cy="32" rx="14" ry="6" fill="none" stroke="white" stroke-width="1.5" transform="rotate(60 32 32)"/>
  <circle cx="32" cy="18" r="2" fill="white"/>
  
  <!-- Orbit 3 (rotated 120 degrees) -->
  <ellipse cx="32" cy="32" rx="14" ry="6" fill="none" stroke="white" stroke-width="1.5" transform="rotate(120 32 32)"/>
  <circle cx="18" cy="46" r="2" fill="white"/>
  
  <!-- UI Elements around -->
  <!-- Top left window -->
  <rect x="8" y="8" width="10" height="8" fill="none" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="8" y1="11" x2="18" y2="11" stroke="white" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Bottom right window -->
  <rect x="46" y="48" width="10" height="8" fill="none" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="46" y1="51" x2="56" y2="51" stroke="white" stroke-width="0.5" opacity="0.5"/>
</svg>
