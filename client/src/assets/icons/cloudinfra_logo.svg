<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#cloudGrad)"/>
  <!-- Central design: Cloud with infrastructure elements -->
  <g transform="translate(100, 100)">
    <!-- Cloud shape -->
    <path d="M -15 10 Q -25 0, -20 -15 Q -10 -20, 0 -18 Q 10 -20, 15 -12 Q 25 -5, 20 10 Z" fill="white" opacity="0.95"/>
    <!-- Data centers under cloud -->
    <rect x="-15" y="15" width="8" height="20" fill="white" opacity="0.8"/>
    <rect x="-2" y="18" width="8" height="17" fill="white" opacity="0.8"/>
    <rect x="8" y="16" width="8" height="19" fill="white" opacity="0.8"/>
    <!-- Connection lines -->
    <line x1="-10" y1="10" x2="-10" y2="15" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="8" x2="0" y2="18" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="10" y1="9" x2="10" y2="16" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>
</svg>