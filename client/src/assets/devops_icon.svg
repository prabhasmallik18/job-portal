<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- DevOps Engineer Icon -->
  <defs>
    <linearGradient id="devopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be123c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Containers -->
  <!-- Container 1 -->
  <rect x="12" y="16" width="14" height="14" fill="none" stroke="white" stroke-width="1.5" rx="1"/>
  <line x1="12" y1="22" x2="26" y2="22" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="15" cy="19" r="1" fill="white"/>
  <circle cx="23" cy="19" r="1" fill="white"/>
  
  <!-- Container 2 -->
  <rect x="38" y="16" width="14" height="14" fill="none" stroke="white" stroke-width="1.5" rx="1"/>
  <line x1="38" y1="22" x2="52" y2="22" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="41" cy="19" r="1" fill="white"/>
  <circle cx="49" cy="19" r="1" fill="white"/>
  
  <!-- Pipeline/Connection -->
  <path d="M 26 23 Q 32 23 38 23" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="32" cy="23" r="2" fill="white"/>
  
  <!-- Database container -->
  <ellipse cx="25" cy="44" rx="8" ry="6" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="17" y1="44" x2="33" y2="44" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="20" cy="42" r="1" fill="white" opacity="0.7"/>
  <circle cx="30" cy="42" r="1" fill="white" opacity="0.7"/>
  
  <!-- Deployment container -->
  <ellipse cx="39" cy="44" rx="8" ry="6" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="31" y1="44" x2="47" y2="44" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="34" cy="42" r="1" fill="white" opacity="0.7"/>
  <circle cx="44" cy="42" r="1" fill="white" opacity="0.7"/>
  
  <!-- Down connections -->
  <line x1="19" y1="30" x2="25" y2="38" stroke="white" stroke-width="1"/>
  <line x1="45" y1="30" x2="39" y2="38" stroke="white" stroke-width="1"/>
  
  <!-- Monitopring dot -->
  <circle cx="52" cy="44" r="2" fill="white" opacity="0.8"/>
  <circle cx="56" cy="46" r="1.5" fill="white" opacity="0.6"/>
</svg>
