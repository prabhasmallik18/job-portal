<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient defines -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8787;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="32" fill="url(#redGradient)"/>
  
  <!-- Stars Around -->
  <!-- Top Left Star -->
  <polygon points="12,12 14,18 20,18 15,23 17,29 12,24 7,29 9,23 4,18 10,18" fill="url(#goldGradient)"/>
  
  <!-- Top Right Star -->
  <polygon points="52,10 54,16 60,16 55,21 57,27 52,22 47,27 49,21 44,16 50,16" fill="url(#goldGradient)"/>
  
  <!-- Bottom Right Star -->
  <polygon points="54,48 56,54 62,54 57,59 59,65 54,60 49,65 51,59 46,54 52,54" fill="url(#goldGradient)"/>
  
  <!-- Main Document Stack -->
  <g>
    <!-- First Document -->
    <rect x="18" y="26" width="18" height="22" rx="2" fill="white" opacity="0.95"/>
    <line x1="22" y1="32" x2="30" y2="32" stroke="url(#redGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="38" x2="30" y2="38" stroke="url(#redGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="44" x2="26" y2="44" stroke="url(#redGradient)" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Second Document (overlapped) -->
    <rect x="28" y="32" width="18" height="22" rx="2" fill="white" opacity="0.9" stroke="url(#goldGradient)" stroke-width="0.5"/>
    <line x1="32" y1="38" x2="40" y2="38" stroke="url(#redGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="44" x2="40" y2="44" stroke="url(#redGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="50" x2="36" y2="50" stroke="url(#redGradient)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Trending Arrow -->
  <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="38,48 48,38 48,48"/>
  </g>
</svg>
