<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Junior Frontend Developer Icon -->
  <defs>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Computer Monitor -->
  <rect x="12" y="14" width="40" height="28" fill="none" stroke="white" stroke-width="2.5" rx="2"/>
  
  <!-- Screen -->
  <rect x="14" y="16" width="36" height="24" fill="white" opacity="0.05"/>
  
  <!-- Code elements -->
  <!-- Left bracket -->
  <path d="M 18 20 L 20 20 L 20 32 L 18 32" stroke="white" stroke-width="1.5" fill="none"/>
  
  <!-- Center code lines -->
  <line x1="22" y1="22" x2="32" y2="22" stroke="white" stroke-width="1.5"/>
  <line x1="22" y1="26" x2="34" y2="26" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="22" y1="30" x2="30" y2="30" stroke="white" stroke-width="1.5"/>
  
  <!-- Right bracket -->
  <path d="M 44 20 L 46 20 L 46 32 L 44 32" stroke="white" stroke-width="1.5" fill="none"/>
  
  <!-- Stand -->
  <rect x="26" y="42" width="12" height="2" fill="white"/>
  
  <!-- Base -->
  <ellipse cx="32" cy="46" rx="12" ry="3" fill="white" opacity="0.7"/>
  
  <!-- Star (Junior badge) -->
  <polygon points="48,14 50,20 56,20 51,24 53,30 48,26 43,30 45,24 40,20 46,20" fill="white" opacity="0.8"/>
</svg>
