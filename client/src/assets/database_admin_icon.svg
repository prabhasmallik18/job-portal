<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Database Administrator Icon -->
  <defs>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stacked Cylinders (Database) -->
  <!-- Top cylinder -->
  <ellipse cx="32" cy="18" rx="10" ry="4" fill="white" opacity="0.9"/>
  <rect x="22" y="18" width="20" height="8" fill="white" opacity="0.7"/>
  <ellipse cx="32" cy="26" rx="10" ry="4" fill="white" opacity="0.9"/>
  
  <!-- Middle cylinder -->
  <ellipse cx="32" cy="32" rx="11" ry="5" fill="white" opacity="0.85"/>
  <rect x="21" y="32" width="22" height="9" fill="white" opacity="0.65"/>
  <ellipse cx="32" cy="41" rx="11" ry="5" fill="white" opacity="0.85"/>
  
  <!-- Bottom cylinder -->
  <ellipse cx="32" cy="47" rx="12" ry="6" fill="white" opacity="0.8"/>
  <rect x="20" y="47" width="24" height="10" fill="white" opacity="0.6"/>
  <ellipse cx="32" cy="57" rx="12" ry="6" fill="white" opacity="0.8"/>
  
  <!-- Lock symbol (security) -->
  <circle cx="50" cy="48" r="5" fill="none" stroke="white" stroke-width="1.5"/>
  <rect x="47" y="50" width="6" height="5" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="49" y1="50" x2="49" y2="48" stroke="white" stroke-width="1"/>
</svg>
