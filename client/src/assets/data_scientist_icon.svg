<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Data Scientist Icon -->
  <defs>
    <linearGradient id="dataScientistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Graph background -->
  <rect x="12" y="12" width="40" height="40" fill="none" stroke="white" stroke-width="1.5" opacity="0.4" rx="2"/>
  
  <!-- Bar Chart Bars -->
  <!-- Bar 1 -->
  <rect x="16" y="38" width="5" height="10" fill="white" opacity="0.9"/>
  
  <!-- Bar 2 (taller) -->
  <rect x="24" y="30" width="5" height="18" fill="white" opacity="0.85"/>
  
  <!-- Bar 3 (tallest) -->
  <rect x="32" y="22" width="5" height="26" fill="white" opacity="0.9"/>
  
  <!-- Bar 4 -->
  <rect x="40" y="34" width="5" height="14" fill="white" opacity="0.8"/>
  
  <!-- Axis lines -->
  <line x1="14" y1="48" x2="48" y2="48" stroke="white" stroke-width="1.5"/>
  <line x1="14" y1="48" x2="14" y2="16" stroke="white" stroke-width="1.5"/>
  
  <!-- Data points line (trend) -->
  <polyline points="18.5,37 27,27 35,15 43,32" stroke="white" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="2,2"/>
  
  <!-- Data points -->
  <circle cx="18.5" cy="37" r="1.5" fill="white"/>
  <circle cx="27" cy="27" r="1.5" fill="white"/>
  <circle cx="35" cy="15" r="1.5" fill="white"/>
  <circle cx="43" cy="32" r="1.5" fill="white"/>
  
  <!-- Plus sign (analysis) -->
  <line x1="48" y1="10" x2="56" y2="10" stroke="white" stroke-width="1.5"/>
  <line x1="52" y1="6" x2="52" y2="14" stroke="white" stroke-width="1.5"/>
</svg>
