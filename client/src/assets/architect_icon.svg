<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Solutions Architect Icon -->
  <defs>
    <linearGradient id="architectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Blueprint Grid -->
  <rect x="12" y="12" width="40" height="40" fill="none" stroke="white" stroke-width="2" rx="4"/>
  
  <!-- Grid Lines -->
  <line x1="20" y1="12" x2="20" y2="52" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="44" y1="12" x2="44" y2="52" stroke="white" stroke-width="1" opacity="0.6"/>
  
  <line x1="12" y1="20" x2="52" y2="20" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="white" stroke-width="1" opacity="0.6"/>
  
  <!-- Circles on intersections -->
  <circle cx="20" cy="20" r="2" fill="white"/>
  <circle cx="32" cy="20" r="2" fill="white"/>
  <circle cx="44" cy="20" r="2" fill="white"/>
  <circle cx="20" cy="32" r="2" fill="white"/>
  <circle cx="32" cy="32" r="3" fill="white"/>
  <circle cx="44" cy="32" r="2" fill="white"/>
  <circle cx="20" cy="44" r="2" fill="white"/>
  <circle cx="32" cy="44" r="2" fill="white"/>
  <circle cx="44" cy="44" r="2" fill="white"/>
</svg>
