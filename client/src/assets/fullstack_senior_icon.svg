<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Senior Full Stack Developer Icon -->
  <defs>
    <linearGradient id="fullstackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Frontend side (Left) - Browser/UI -->
  <rect x="10" y="14" width="18" height="24" fill="none" stroke="white" stroke-width="1.5" rx="2"/>
  
  <!-- Browser top bar -->
  <rect x="10" y="14" width="18" height="4" fill="white" opacity="0.3"/>
  <circle cx="13" cy="16" r="0.8" fill="white"/>
  <circle cx="16" cy="16" r="0.8" fill="white"/>
  <circle cx="19" cy="16" r="0.8" fill="white"/>
  
  <!-- Browser content (UI elements) -->
  <rect x="12" y="20" width="6" height="3" fill="white" opacity="0.8"/>
  <line x1="12" y1="24" x2="24" y2="24" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="12" y1="26" x2="24" y2="26" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <line x1="12" y1="28" x2="20" y2="28" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <circle cx="14" cy="33" r="2" fill="white" opacity="0.7"/>
  
  <!-- Backend side (Right) - Server/API -->
  <rect x="36" y="14" width="18" height="24" fill="none" stroke="white" stroke-width="1.5" rx="2"/>
  
  <!-- Server stacks -->
  <rect x="38" y="18" width="14" height="4" fill="none" stroke="white" stroke-width="1"/>
  <line x1="38" y1="21" x2="52" y2="21" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <circle cx="40" cy="19" r="0.8" fill="white" opacity="0.8"/>
  <circle cx="50" cy="19" r="0.8" fill="white" opacity="0.8"/>
  
  <rect x="38" y="24" width="14" height="4" fill="none" stroke="white" stroke-width="1"/>
  <line x1="38" y1="27" x2="52" y2="27" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <circle cx="40" cy="25" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="50" cy="25" r="0.8" fill="white" opacity="0.7"/>
  
  <rect x="38" y="30" width="14" height="4" fill="none" stroke="white" stroke-width="1"/>
  <line x1="38" y1="33" x2="52" y2="33" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <circle cx="40" cy="31" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="50" cy="31" r="0.8" fill="white" opacity="0.6"/>
  
  <!-- Connection/Bridge between Frontend and Backend -->
  <line x1="28" y1="26" x2="36" y2="26" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="32" cy="26" r="1.5" fill="white"/>
  
  <!-- Senior badge (Crown/Star) -->
  <polygon points="32,8 34,12 38,12 35,15 36,19 32,16 28,19 29,15 26,12 30,12" fill="white" opacity="0.9"/>
</svg>
