<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#quantumGrad)"/>
  <!-- Central design: Quantum particles/atoms -->
  <g transform="translate(100, 100)">
    <!-- Central nucleus -->
    <circle cx="0" cy="0" r="8" fill="white" stroke="white" stroke-width="1"/>
    <!-- Electron orbits -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <!-- Electrons -->
    <circle cx="25" cy="0" r="4" fill="white"/>
    <circle cx="-20" cy="15" r="4" fill="white"/>
    <circle cx="-10" cy="-35" r="4" fill="white"/>
    <circle cx="32" cy="25" r="3" fill="white" opacity="0.8"/>
  </g>
</svg>