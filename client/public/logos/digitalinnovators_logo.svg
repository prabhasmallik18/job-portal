<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="digitalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9a56;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#digitalGrad)"/>
  <!-- Central design: Digital waves/innovation symbol -->
  <g transform="translate(100, 100)">
    <!-- Waves -->
    <path d="M -30 10 Q -15 0, 0 10 T 30 10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -35 -5 Q -15 -15, 0 -5 T 35 -5" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M -25 25 Q -10 15, 0 25 T 25 25" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Central dot -->
    <circle cx="0" cy="0" r="6" fill="white"/>
  </g>
</svg>