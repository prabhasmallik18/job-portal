<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nextgenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#nextgenGrad)"/>
  <!-- Central design: Upward arrow/growth -->
  <g transform="translate(100, 95)">
    <!-- Base -->
    <rect x="-5" y="15" width="10" height="15" fill="white" opacity="0.9"/>
    <rect x="-15" y="5" width="10" height="25" fill="white" opacity="0.85"/>
    <rect x="5" y="-5" width="10" height="35" fill="white" opacity="0.9"/>
    <!-- Arrow tip -->
    <polygon points="0,-20 -12,-5 -4,-5 -4,0 4,0 4,-5 12,-5" fill="white"/>
  </g>
</svg>