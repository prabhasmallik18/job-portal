<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#neuralGrad)"/>
  <!-- Central design: Neural network brain -->
  <g transform="translate(100, 100)">
    <!-- Brain-like nodes -->
    <circle cx="0" cy="-15" r="8" fill="white"/>
    <circle cx="-18" cy="8" r="7" fill="white"/>
    <circle cx="18" cy="8" r="7" fill="white"/>
    <circle cx="-10" cy="22" r="6" fill="white"/>
    <circle cx="10" cy="22" r="6" fill="white"/>
    <!-- Connecting synapse lines -->
    <line x1="0" y1="-15" x2="-18" y2="8" stroke="white" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="-15" x2="18" y2="8" stroke="white" stroke-width="2" opacity="0.8"/>
    <line x1="-18" y1="8" x2="-10" y2="22" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="18" y1="8" x2="10" y2="22" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="-10" y1="22" x2="10" y2="22" stroke="white" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>