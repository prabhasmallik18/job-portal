<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="datapulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#datapulseGrad)"/>
  <!-- Central design: Pulse/heartbeat with data graph -->
  <g transform="translate(100, 100)">
    <!-- Pulse line -->
    <polyline points="-35,0 -25,-5 -20,5 -10,-10 0,10 10,-8 20,6 30,-3 35,0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Data bars -->
    <rect x="-30" y="15" width="8" height="12" fill="white" opacity="0.8"/>
    <rect x="-15" y="12" width="8" height="15" fill="white" opacity="0.8"/>
    <rect x="0" y="10" width="8" height="17" fill="white" opacity="0.8"/>
    <rect x="15" y="13" width="8" height="14" fill="white" opacity="0.8"/>
    <rect x="30" y="14" width="8" height="13" fill="white" opacity="0.8"/>
  </g>
</svg>